<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        h1 {
            margin-top: 0;
            text-shadow: 2px 2px #000;
        }

        #game-board {
            width: 400px;
            height: 400px;
            border: 5px solid #ecf0f1;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #34495e;
        }

        #score-board {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 1px 1px #000;
        }

        #controls {
            margin: 10px 0;
        }

        #controls button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 5px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #controls button:hover {
            background-color: #2980b9;
        }

        #controls button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        .controls-hint {
            margin-top: 10px;
            font-size: 14px;
            color: #bdc3c7;
        }

        #help-btn {
            padding: 8px 12px;
            font-size: 16px;
            margin: 0 5px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
            position: relative;
        }

        #help-btn:hover {
            background-color: #c0392b;
        }

        #help-tooltip {
            display: none;
            position: absolute;
            bottom: 50px;
            left: 0;
            background-color: #2c3e50;
            border: 2px solid #e74c3c;
            padding: 12px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 1000;
            color: #bdc3c7;
        }

        #help-btn:hover #help-tooltip {
            display: block;
        }

        #game-container {
            position: relative;
            display: inline-block;
        }

        #direction-indicator {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: #2ecc71;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }

        #direction-indicator.show {
            display: block;
            opacity: 1;
        }

        @keyframes snakePattern {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 100% 100%;
            }
        }

        #game-container::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(46, 204, 113, 0.1) 35px, rgba(46, 204, 113, 0.1) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(46, 204, 113, 0.1) 35px, rgba(46, 204, 113, 0.1) 70px);
            background-size: 200% 200%;
            animation: snakePattern 6s linear infinite;
            border-radius: 10px;
            z-index: -1;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.2);
        }
    </style>
</head>
<body>

    <h1>SNAKE GAME - Vibe Coding</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    <div id="game-container">
        <canvas id="game-board" width="400" height="400"></canvas>
        <div id="direction-indicator"></div>
    </div>
    <div id="controls">
        <button id="start-btn">Start Game</button>
        <button id="pause-btn" disabled>Pause Game</button>
        <button id="help-btn">
            ?
            <div id="help-tooltip">
                Enter: Start Game<br>
                Space: Pause/Resume<br>
                Arrow Keys/WASD: Move<br>
                Hover: See Direction
            </div>
        </button>
    </div>
    <!-- <div class="controls-hint">Use Arrow Keys or WASD to move , enter to start the game and Space to pause the game </div> -->

    <script>
        // --- Game Setup ---
        const canvas = document.getElementById("game-board");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const startBtn = document.getElementById("start-btn");
        const pauseBtn = document.getElementById("pause-btn");

        // Grid settings
        const tileSize = 20; // Size of one square in pixels
        const tileCount = canvas.width / tileSize; // 20 tiles x 20 tiles

        // Game State Variables
        let velocityX = 0;
        let velocityY = 0;
        let snake = [];
        let appleX = 5;
        let appleY = 5;
        let score = 0;
        let gameInterval;
        let isGameRunning = false;
        let specialAppleX = -1;
        let specialAppleY = -1;
        let specialAppleActive = false;

        // --- Drawing Functions ---

        function drawTile(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * tileSize, y * tileSize, tileSize - 2, tileSize - 2);
        }

        function drawGame() {
            // Clear board
            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                drawTile(snake[i].x, snake[i].y, i === 0 ? "#2ecc71" : "white");
            }

            // Draw apple
            drawTile(appleX, appleY, "red");

            // Draw special apple if active
            if (specialAppleActive) {
                drawTile(specialAppleX, specialAppleY, "gold");
            }
        }

        function resetGame() {
            snake = [
                {x: 10, y: 10}, // Head
                {x: 9, y: 10},
                {x: 8, y: 10}   // Tail
            ];
            score = 0;
            velocityX = 1; // Start moving right
            velocityY = 0;
            scoreElement.innerText = score;
            isGameRunning = false;
            specialAppleActive = false;

            placeApple();

            if (gameInterval) clearInterval(gameInterval);

            drawGame(); // Draw initial state

            // Enable start button, disable pause
            startBtn.disabled = false;
            startBtn.innerText = "Start Game";
            pauseBtn.disabled = true;
            pauseBtn.innerText = "Pause Game";
        }

        function mainLoop() {
            if(!isGameRunning) return;

            // 1. Move Snake
            snake.unshift({x: snake[0].x + velocityX, y: snake[0].y + velocityY});

            // 2. Check Apple Collision
            if (snake[0].x === appleX && snake[0].y === appleY) {
                score++;
                scoreElement.innerText = score;

                placeApple();

                // 10% chance to spawn special apple
                if (Math.random() < 0.1) {
                    placeSpecialApple();
                }
            } else {
                snake.pop(); // Remove the tail segment only if no apple eaten
            }

            // Check Special Apple Collision
            if (specialAppleActive && snake[0].x === specialAppleX && snake[0].y === specialAppleY) {
                score += 5; // Bonus points
                scoreElement.innerText = score;
                specialAppleActive = false;
            }

            // 3. Check Game Over Conditions
            let gameOver = false;

            // Hitting walls
            if (snake[0].x < 0 || snake[0].x >= tileCount ||
                snake[0].y < 0 || snake[0].y >= tileCount) {
                gameOver = true;
            }

            // Hitting self
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
                    gameOver = true;
                }
            }

            // Draw the game
            drawGame();

            if (gameOver) {
                clearInterval(gameInterval);
                isGameRunning = false;
                let opacity = 0;
                const fadeInterval = setInterval(() => {
                    drawGame();
                    ctx.fillStyle = `rgba(0,0,0,${opacity})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    opacity += 0.05;
                    if (opacity >= 0.5) {
                        clearInterval(fadeInterval);
                        ctx.fillStyle = "white";
                        ctx.font = "30px Arial";
                        ctx.textAlign = "center";
                        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 + 10);
                        startBtn.disabled = false;
                        startBtn.innerText = "Restart Game";
                        pauseBtn.disabled = true;
                    }
                }, 50);
            }
        }

        function placeApple() {
            appleX = Math.floor(Math.random() * tileCount);
            appleY = Math.floor(Math.random() * tileCount);

            // Make sure apple doesn't spawn on snake body
            for(let part of snake) {
                if(part.x === appleX && part.y === appleY) {
                    placeApple(); // Try again
                    break;
                }
            }
        }

        function placeSpecialApple() {
            specialAppleX = Math.floor(Math.random() * tileCount);
            specialAppleY = Math.floor(Math.random() * tileCount);

            // Make sure special apple doesn't spawn on snake body or regular apple
            for(let part of snake) {
                if(part.x === specialAppleX && part.y === specialAppleY) {
                    placeSpecialApple(); // Try again
                    return;
                }
            }
            if(specialAppleX === appleX && specialAppleY === appleY) {
                placeSpecialApple(); // Try again
                return;
            }
            specialAppleActive = true;
        }

        // --- Input Handling ---
        document.addEventListener("keydown", function(event) {
            const key = event.key;

            // Start game on Enter key
            if (key === "Enter") {
                startGameHandler();
                return;
            }

            // Pause/Resume game on Space key
            if (key === " ") {
                pauseGameHandler();
                return;
            }

            // Prevent reversing directly into own body
            if (key === "ArrowLeft" && velocityX === 0) {
                velocityX = -1; velocityY = 0;
            }
            else if (key === "ArrowUp" && velocityY === 0) {
                velocityX = 0; velocityY = -1;
            }
            else if (key === "ArrowRight" && velocityX === 0) {
                velocityX = 1; velocityY = 0;
            }
            else if (key === "ArrowDown" && velocityY === 0) {
                velocityX = 0; velocityY = 1;
            }

            // WASD support
            if (key === "a" && velocityX === 0) {
                velocityX = -1; velocityY = 0;
            }
            else if (key === "w" && velocityY === 0) {
                velocityX = 0; velocityY = -1;
            }
            else if (key === "d" && velocityX === 0) {
                velocityX = 1; velocityY = 0;
            }
            else if (key === "s" && velocityY === 0) {
                velocityX = 0; velocityY = 1;
            }
        });

        // --- Button Handlers ---
        function startGameHandler() {
            // Only start if start button is enabled (game isn't already running)
            if (startBtn.disabled) return;

            resetGame();
            startBtn.disabled = true;
            pauseBtn.disabled = true;

            let count = 3;
            const countdownInterval = setInterval(() => {
                drawGame();
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "50px Arial";
                ctx.textAlign = "center";
                if (count > 0) {
                    ctx.fillText(count, canvas.width / 2, canvas.height / 2);
                } else if (count === 0) {
                    ctx.fillText("Go!", canvas.width / 2, canvas.height / 2);
                }
                count--;
                if (count < 0) {
                    clearInterval(countdownInterval);
                    isGameRunning = true;
                    gameInterval = setInterval(mainLoop, 100);
                    pauseBtn.disabled = false;
                }
            }, 1000);
        }

        startBtn.addEventListener("click", startGameHandler);

        function pauseGameHandler() {
            // Only pause if the pause button is enabled (game is running)
            if (pauseBtn.disabled) return;

            if (isGameRunning) {
                isGameRunning = false;
                clearInterval(gameInterval);
                pauseBtn.innerText = "Resume Game";
            } else {
                isGameRunning = true;
                gameInterval = setInterval(mainLoop, 100);
                pauseBtn.innerText = "Pause Game";
            }
        }

        pauseBtn.addEventListener("click", pauseGameHandler);

        // --- Direction Indicator on Hover ---
        const gameContainer = document.getElementById("game-container");
        const directionIndicator = document.getElementById("direction-indicator");

        function getDirectionText() {
            if (velocityX === 1) return "➡️ RIGHT";
            if (velocityX === -1) return "⬅️ LEFT";
            if (velocityY === -1) return "⬆️ UP";
            if (velocityY === 1) return "⬇️ DOWN";
            return "🎮";
        }

        gameContainer.addEventListener("mouseenter", function() {
            directionIndicator.classList.add("show");
        });

        gameContainer.addEventListener("mouseleave", function() {
            directionIndicator.classList.remove("show");
        });

        // Update direction indicator continuously
        setInterval(function() {
            directionIndicator.innerText = getDirectionText();
        }, 100);

        // Start the game
        resetGame();

    </script>
</body>
</html>
